quarkus.mongodb.connection-string=mongodb://localhost:27017/testdb
quarkus.mongodb.database=testdb

quarkus.swagger-ui.always-include=false
quarkus.smallrye-openapi.store-schema-directory=docs
%test.quarkus.smallrye-openapi.store-schema-directory=target/test-openapi
%dev.quarkus.smallrye-openapi.store-schema-directory=target/dev-openapi
quarkus.smallrye-openapi.info-title=Shorten URL API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.security-scheme-name=SecurityScheme
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.roles.user=admin,user
quarkus.security.users.embedded.users.user=p@ssword
quarkus.security.users.embedded.plain-text=true
quarkus.http.auth.basic=true

# Custom configuration properties
shorterurl.config.home=https://solocoding.dev/